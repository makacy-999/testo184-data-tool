name: Build Releases (macOS & Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: Testo184-Tool-macOS
            sep: ':'
          - os: windows-latest
            artifact_name: Testo184-Tool-Windows
            sep: ';'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flask openpyxl pyinstaller

      - name: Build executable
        run: >
          pyinstaller --name Testo184Tool --onefile
          --add-data "templates${{ matrix.sep }}templates"
          --add-data "static${{ matrix.sep }}static"
          app.py

      - name: Rename artifact
        shell: bash
        run: |
          cd dist
          if [ "$(uname)" = "Darwin" ]; then
            mv Testo184Tool Testo184Tool-macOS
          else
            mv Testo184Tool.exe Testo184Tool-Windows.exe
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
