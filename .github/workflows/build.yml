name: Build Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flask openpyxl pdfplumber olefile pyinstaller comtypes pywin32

      - name: Build main executable
        shell: bash
        run: |
          pyinstaller --name Testo184Tool --onefile --noconsole \
            --add-data "templates;templates" \
            --add-data "static;static" \
            --add-data "vi2_parser.py;." \
            app.py

      - name: Build collector executable
        shell: bash
        run: |
          pyinstaller --name TestoCollector --onefile --noconsole \
            --add-data "collector/testo184_vi2_export.py;." \
            --hidden-import comtypes \
            --hidden-import comtypes.stream \
            --hidden-import comtypes.automation \
            collector/testo184_vi2_export.py

      - name: Package into ZIP
        shell: bash
        run: |
          cd dist
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkg
          cp Testo184Tool.exe "pkg/Testo184Tool-Windows.exe"
          cp TestoCollector.exe "pkg/TestoCollector-Windows.exe"
          cd pkg
          python -c "import shutil; shutil.make_archive('Testo184Tool-Windows-v${VERSION}', 'zip', '.')"
          mv "Testo184Tool-Windows-v${VERSION}.zip" ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/Testo184Tool-Windows-v*.zip
          name: ${{ github.ref_name }}
          body: |
            ## Testo 184 数据读取汇总工具 ${{ github.ref_name }}（Windows）
            - 一键读取温度计数据并汇总 Excel
            - 自动采集：插拔温度计即自动读取原始数据（内置采集器）
            - 支持批量上传 .vi2 文件一键导出
            - 免安装，下载 ZIP 解压后运行 .exe
          draft: false
          prerelease: false
