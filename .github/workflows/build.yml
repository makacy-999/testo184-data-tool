name: Build Releases (macOS & Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: Testo184-Tool-macOS
          - os: windows-latest
            artifact_name: Testo184-Tool-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flask openpyxl pdfplumber olefile pyinstaller

      - name: Build executable
        shell: bash
        run: |
          SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; fi
          pyinstaller --name Testo184Tool --onefile --noconsole \
            --add-data "templates${SEP}templates" \
            --add-data "static${SEP}static" \
            --add-data "vi2_parser.py${SEP}." \
            app.py

      - name: Rename artifact
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            mv Testo184Tool Testo184Tool-macOS
          else
            mv Testo184Tool.exe Testo184Tool-Windows.exe
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
