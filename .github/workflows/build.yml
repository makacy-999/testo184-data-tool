name: Build Releases (macOS & Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: Testo184-Tool-macOS
          - os: windows-latest
            artifact_name: Testo184-Tool-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flask openpyxl pdfplumber olefile pyinstaller

      - name: Build executable
        shell: bash
        run: |
          SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; fi
          pyinstaller --name Testo184Tool --onefile --noconsole \
            --add-data "templates${SEP}templates" \
            --add-data "static${SEP}static" \
            --add-data "vi2_parser.py${SEP}." \
            app.py

      - name: Package into ZIP
        shell: bash
        run: |
          cd dist
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkg
          if [ "$RUNNER_OS" = "macOS" ]; then
            chmod +x Testo184Tool
            cp Testo184Tool "pkg/Testo184Tool-macOS"
            cd pkg && zip -r "../Testo184Tool-macOS-v${VERSION}.zip" "Testo184Tool-macOS"
          else
            cp Testo184Tool.exe "pkg/Testo184Tool-Windows.exe"
            cd pkg
            python -c "import shutil; shutil.make_archive('Testo184Tool-Windows-v${VERSION}', 'zip', '.', 'Testo184Tool-Windows.exe')"
            mv "Testo184Tool-Windows-v${VERSION}.zip" ..
          fi
          ls -la ..
        env:
          VERSION: ${{ github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.zip

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
