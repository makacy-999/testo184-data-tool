name: Build Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flask openpyxl pdfplumber olefile pyinstaller

      - name: Build executable
        shell: bash
        run: |
          pyinstaller --name Testo184Tool --onefile --noconsole \
            --add-data "templates;templates" \
            --add-data "static;static" \
            --add-data "vi2_parser.py;." \
            app.py

      - name: Package into ZIP
        shell: bash
        run: |
          cd dist
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkg
          cp Testo184Tool.exe "pkg/Testo184Tool-Windows.exe"
          cd pkg
          python -c "import shutil; shutil.make_archive('Testo184Tool-Windows-v${VERSION}', 'zip', '.', 'Testo184Tool-Windows.exe')"
          mv "Testo184Tool-Windows-v${VERSION}.zip" ..
          ls -la ..
