name: Build Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flask openpyxl pdfplumber olefile pyinstaller comtypes pywin32

      - name: Pre-generate comtypes UIAutomationClient module
        shell: bash
        run: |
          # comtypes.gen.UIAutomationClient 是运行时动态生成的；必须先在本机生成，
          # 否则 PyInstaller 收集不到、单exe运行时 import 失败（No module named）。
          python -c "import comtypes.client; comtypes.client.GetModule('UIAutomationCore.dll'); import comtypes.gen.UIAutomationClient as _u; print('UIA generated at', _u.__file__)"

      - name: Build main executable (single exe, includes collector)
        shell: bash
        run: |
          pyinstaller --name Testo184Tool --onefile --noconsole \
            --add-data "templates;templates" \
            --add-data "static;static" \
            --add-data "vi2_parser.py;." \
            --add-data "collector;collector" \
            --collect-all comtypes \
            --hidden-import comtypes.stream \
            --hidden-import comtypes.automation \
            --hidden-import comtypes.gen.UIAutomationClient \
            --collect-submodules comtypes.gen \
            app.py
          # 打印 exe 大小便于核对
          python -c "import glob,os; [print('  EXE', f, os.path.getsize(f)//1024, 'KB') for f in glob.glob('dist/*.exe')]"

      - name: Package into ZIP
        shell: bash
        run: |
          cd dist
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkg
          cp Testo184Tool.exe "pkg/Testo184Tool-Windows.exe"
          cd pkg
          python -c "import shutil; shutil.make_archive('Testo184Tool-Windows-v${VERSION}', 'zip', '.', 'Testo184Tool-Windows.exe')"
          mv "Testo184Tool-Windows-v${VERSION}.zip" ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/Testo184Tool-Windows-v*.zip
          name: ${{ github.ref_name }}
          body: |
            ## Testo 184 数据读取汇总工具 ${{ github.ref_name }}（Windows）
            - 一键读取温度计数据并汇总 Excel
            - 自动采集：插拔温度计即自动读取原始数据
            - 支持批量上传 .vi2 文件一键导出
            - 免安装，单文件 exe，下载 ZIP 解压后运行 .exe 即可
          draft: false
          prerelease: false
